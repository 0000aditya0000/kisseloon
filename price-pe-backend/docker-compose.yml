services:
  postgres:
    image: postgres:16-alpine
    container_name: pricepe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pricepe
    ports:
      # Host 55432 → container 5432 (avoids conflict with local Postgres on 5432)
      - "55432:5432"
    volumes:
      - pricepe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pricepe']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pricepe_pgdata:
